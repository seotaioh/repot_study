<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연구소 주간업무 RAG 시스템 (LangGraph)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 22px; }
        .header .subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }
        .header .stats {
            font-size: 13px;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 24px;
            background: white;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            background: #1a73e8;
            color: white;
        }
        .panel {
            display: none;
            background: white;
            border-radius: 0 12px 12px 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .panel.active { display: block; }

        /* 업로드 영역 */
        .upload-zone {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-zone.dragover {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .upload-zone h3 { margin-bottom: 8px; color: #555; }
        .upload-zone p { color: #888; font-size: 13px; }
        .upload-form {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .upload-form input[type="text"] {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
        }
        .upload-form input[type="file"] { display: none; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-secondary { background: #e8e8e8; color: #333; }
        .btn-danger { background: #ea4335; color: white; }

        /* 검색 영역 */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #1a73e8; }
        .search-box select {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        /* 모드 토글 */
        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            background: white;
            color: #666;
            transition: all 0.2s;
        }
        .mode-btn.active {
            border-color: #1a73e8;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .mode-btn:hover { border-color: #1a73e8; }

        /* 결과 카드 */
        .results { margin-top: 16px; }
        .result-card {
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: box-shadow 0.2s;
        }
        .result-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .result-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .result-meta .score {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .result-text {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
        }

        /* RAG 답변 */
        .answer-box {
            background: #f8f9fa;
            border-left: 4px solid #1a73e8;
            border-radius: 0 8px 8px 0;
            padding: 20px;
            margin-top: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 14px;
        }

        /* 워크플로우 단계 */
        .workflow-steps {
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }
        .workflow-steps h4 {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            color: #555;
        }
        .step-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4caf50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .step-icon.warn { background: #ff9800; }
        .step-icon.error { background: #ef5350; }

        /* 메타 배지 */
        .meta-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-blue { background: #e8f0fe; color: #1a73e8; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-orange { background: #fff3e0; color: #e65100; }
        .badge-red { background: #fce4ec; color: #c62828; }

        /* 통계 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: #1a73e8;
        }
        .stat-card .label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .file-list { margin-top: 16px; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .file-item .info { font-size: 14px; }
        .file-item .info small { color: #888; }

        /* 처리 상태 */
        .processing {
            background: #fff3e0;
            border: 1px solid #ffcc02;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }
        .processing.show { display: block; }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid #ccc;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 처리 결과 */
        .pipeline-result {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
        }
        .pipeline-result.success { background: #e8f5e9; border: 1px solid #4caf50; }
        .pipeline-result.error { background: #fce4ec; border: 1px solid #ef5350; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>연구소 주간업무 RAG 시스템</h1>
        <div class="subtitle">LangChain + LangGraph 기반 고급 RAG 파이프라인</div>
    </div>
    <div class="stats" id="headerStats">로딩중...</div>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="showTab('upload')">PDF 업로드</button>
        <button class="tab" onclick="showTab('search')">검색</button>
        <button class="tab" onclick="showTab('ask')">RAG 질의</button>
        <button class="tab" onclick="showTab('stats')">DB 현황</button>
    </div>

    <!-- 업로드 탭 -->
    <div id="tab-upload" class="panel active">
        <div class="upload-zone" id="dropZone">
            <h3>PDF 파일을 드래그하거나 클릭하여 업로드</h3>
            <p>업로드 즉시 자동으로 텍스트 추출 &rarr; 청킹 &rarr; 임베딩 &rarr; 벡터DB 저장이 수행됩니다</p>
            <div class="upload-form">
                <input type="text" id="researcherName" placeholder="연구원 이름" />
                <input type="file" id="fileInput" accept=".pdf" multiple />
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    파일 선택
                </button>
            </div>
        </div>
        <div class="processing" id="processingStatus">
            <span class="spinner"></span>
            <span id="processingText">PDF 처리 중...</span>
        </div>
        <div id="uploadResult"></div>
    </div>

    <!-- 검색 탭 -->
    <div id="tab-search" class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="검색어를 입력하세요 (예: 이번 주 개발 진행상황)"
                   onkeydown="if(event.key==='Enter')doSearch()" />
            <select id="searchResearcher">
                <option value="">전체 연구원</option>
            </select>
            <button class="btn btn-primary" onclick="doSearch()">검색</button>
        </div>
        <div class="results" id="searchResults"></div>
    </div>

    <!-- RAG 질의 탭 -->
    <div id="tab-ask" class="panel">
        <div class="mode-toggle">
            <span style="font-size:13px;color:#888;line-height:36px;margin-right:8px;">RAG 모드:</span>
            <button class="mode-btn active" onclick="setAskMode('basic', this)">기본</button>
            <button class="mode-btn" onclick="setAskMode('langchain', this)">LangChain</button>
            <button class="mode-btn" onclick="setAskMode('langgraph', this)">LangGraph (고급)</button>
        </div>
        <div id="modeDescription" style="font-size:12px;color:#aaa;margin-bottom:12px;">
            기본 RAG: 검색 + LLM 답변 생성
        </div>
        <div class="search-box">
            <input type="text" id="askQuery" placeholder="질문을 입력하세요 (예: 이번 주 주요 이슈는 무엇인가요?)"
                   onkeydown="if(event.key==='Enter')doAsk()" />
            <select id="askResearcher">
                <option value="">전체 연구원</option>
            </select>
            <button class="btn btn-primary" onclick="doAsk()">질문하기</button>
        </div>
        <div id="askAnswer"></div>
        <div id="askWorkflow"></div>
        <div class="results" id="askSources"></div>
    </div>

    <!-- DB 현황 탭 -->
    <div id="tab-stats" class="panel">
        <div class="stats-grid" id="statsGrid"></div>
        <h3>처리된 파일 목록</h3>
        <div class="file-list" id="fileList"></div>
    </div>
</div>

<script>
    let currentAskMode = 'basic';
    const modeDescriptions = {
        basic: '기본 RAG: 검색 + LLM 답변 생성',
        langchain: 'LangChain RAG: 구조화된 프롬프트 체인 기반 답변 생성',
        langgraph: 'LangGraph RAG: 쿼리 재작성 &rarr; 검색 &rarr; 문서 그레이딩 &rarr; 답변 생성 &rarr; 환각 검증 (자동 재시도)',
    };

    function setAskMode(mode, btn) {
        currentAskMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('modeDescription').innerHTML = modeDescriptions[mode];
    }

    // 탭 전환
    function showTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        event.target.classList.add('active');
        if (name === 'stats') loadStats();
        if (name === 'search' || name === 'ask') loadResearchers();
    }

    // 드래그 앤 드롭
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length) uploadFiles(files);
    });

    document.getElementById('fileInput').addEventListener('change', e => {
        if (e.target.files.length) uploadFiles(e.target.files);
    });

    // 파일 업로드
    async function uploadFiles(files) {
        const researcher = document.getElementById('researcherName').value || 'unknown';
        const status = document.getElementById('processingStatus');
        const resultDiv = document.getElementById('uploadResult');
        resultDiv.innerHTML = '';

        for (const file of files) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                resultDiv.innerHTML += '<div class="pipeline-result error">PDF 파일만 업로드 가능합니다: ' + file.name + '</div>';
                continue;
            }

            status.classList.add('show');
            document.getElementById('processingText').textContent =
                `"${file.name}" 처리 중... (추출 → 청킹 → 임베딩 → 벡터DB)`;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('researcher', researcher);

            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.status === 'completed') {
                    resultDiv.innerHTML += `
                        <div class="pipeline-result success">
                            <strong>${data.file_name}</strong> 처리 완료 (연구원: ${data.researcher})<br>
                            - 추출: ${data.steps.extract.pages}페이지, ${data.steps.extract.chars}자<br>
                            - 청킹: ${data.steps.chunk.chunk_count}개 청크<br>
                            - 벡터DB: ${data.steps.embed_store.stored_chunks}개 저장 (전체 ${data.steps.embed_store.total_in_db}개)
                        </div>`;
                } else if (data.steps?.embed_store?.stored_chunks === 0) {
                    resultDiv.innerHTML += `
                        <div class="pipeline-result success">
                            <strong>${data.file_name}</strong> - 이미 등록된 파일입니다 (중복 방지)
                        </div>`;
                } else {
                    resultDiv.innerHTML += `
                        <div class="pipeline-result error">
                            <strong>${file.name}</strong> 처리 오류: ${data.error || '알 수 없는 오류'}
                        </div>`;
                }
            } catch (err) {
                resultDiv.innerHTML += `
                    <div class="pipeline-result error">
                        <strong>${file.name}</strong> 업로드 실패: ${err.message}
                    </div>`;
            }
        }
        status.classList.remove('show');
        loadHeaderStats();
    }

    // 시맨틱 검색
    async function doSearch() {
        const query = document.getElementById('searchQuery').value;
        if (!query) return;
        const researcher = document.getElementById('searchResearcher').value;
        const params = new URLSearchParams({ q: query, top_k: 10 });
        if (researcher) params.append('researcher', researcher);

        const resp = await fetch('/api/search?' + params);
        const data = await resp.json();

        const div = document.getElementById('searchResults');
        if (!data.results.length) {
            div.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">검색 결과가 없습니다.</p>';
            return;
        }
        div.innerHTML = `<p style="margin-bottom:12px;color:#888;">${data.count}건 검색됨</p>` +
            data.results.map((r, i) => `
                <div class="result-card">
                    <div class="result-meta">
                        <span class="score">유사도 ${(r.score * 100).toFixed(1)}%</span>
                        <span>파일: ${r.metadata.file_name}</span>
                        <span>연구원: ${r.metadata.researcher}</span>
                        <span>페이지: ${r.metadata.page_num}</span>
                    </div>
                    <div class="result-text">${r.text}</div>
                </div>
            `).join('');
    }

    // RAG 질의 (모드별)
    async function doAsk() {
        const query = document.getElementById('askQuery').value;
        if (!query) return;
        const researcher = document.getElementById('askResearcher').value;
        const params = new URLSearchParams({ q: query, top_k: 5 });
        if (researcher) params.append('researcher', researcher);

        document.getElementById('askAnswer').innerHTML = '<div class="answer-box"><span class="spinner"></span> 답변 생성 중...</div>';
        document.getElementById('askSources').innerHTML = '';
        document.getElementById('askWorkflow').innerHTML = '';

        // 모드별 API 엔드포인트
        let endpoint = '/api/ask';
        if (currentAskMode === 'langchain') endpoint = '/api/ask/langchain';
        if (currentAskMode === 'langgraph') endpoint = '/api/ask/langgraph';

        try {
            const resp = await fetch(endpoint + '?' + params);
            const data = await resp.json();

            // 답변 표시
            document.getElementById('askAnswer').innerHTML = `
                <div class="answer-box">${data.answer}</div>`;

            // LangGraph 워크플로우 단계 표시
            if (currentAskMode === 'langgraph' && data.steps) {
                let workflowHtml = '<div class="workflow-steps"><h4>LangGraph 워크플로우 실행 단계</h4>';
                data.steps.forEach(step => {
                    let iconClass = '';
                    if (step.includes('실패') || step.includes('hallucinated')) iconClass = 'error';
                    else if (step.includes('스킵') || step.includes('재작성')) iconClass = 'warn';
                    workflowHtml += `
                        <div class="step-item">
                            <div class="step-icon ${iconClass}">${iconClass === 'error' ? '!' : iconClass === 'warn' ? '~' : '&#10003;'}</div>
                            <span>${step}</span>
                        </div>`;
                });
                workflowHtml += '</div>';

                // 메타 배지
                workflowHtml += '<div class="meta-badges">';
                if (data.rewritten_query) {
                    workflowHtml += `<span class="badge badge-blue">재작성 쿼리: "${data.rewritten_query}"</span>`;
                }
                workflowHtml += `<span class="badge badge-blue">쿼리 재작성: ${data.rewrite_count || 0}회</span>`;
                workflowHtml += `<span class="badge badge-blue">답변 생성: ${data.generation_count || 0}회</span>`;
                if (data.is_grounded !== undefined) {
                    workflowHtml += data.is_grounded
                        ? '<span class="badge badge-green">환각 검증: 통과</span>'
                        : '<span class="badge badge-red">환각 검증: 실패</span>';
                }
                workflowHtml += '</div>';

                document.getElementById('askWorkflow').innerHTML = workflowHtml;
            }

            // 출처 표시
            if (data.sources && data.sources.length) {
                document.getElementById('askSources').innerHTML =
                    `<p style="margin:16px 0 8px;color:#888;font-size:13px;">참조 출처 (${data.sources.length}건)</p>` +
                    data.sources.map(s => `
                        <div class="result-card">
                            <div class="result-meta">
                                <span class="score">${(s.score * 100).toFixed(1)}%</span>
                                <span>${s.file_name}</span>
                                <span>${s.researcher}</span>
                                <span>p.${s.page_num}</span>
                            </div>
                            <div class="result-text">${s.snippet}...</div>
                        </div>
                    `).join('');
            }
        } catch (err) {
            document.getElementById('askAnswer').innerHTML = `
                <div class="pipeline-result error">질의 실패: ${err.message}</div>`;
        }
    }

    // 통계 로드
    async function loadStats() {
        const resp = await fetch('/api/stats');
        const data = await resp.json();

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card">
                <div class="number">${data.total_chunks}</div>
                <div class="label">총 청크 수</div>
            </div>
            <div class="stat-card">
                <div class="number">${data.total_files}</div>
                <div class="label">총 파일 수</div>
            </div>
            <div class="stat-card">
                <div class="number">${Object.keys(data.researchers).length}</div>
                <div class="label">연구원 수</div>
            </div>
        `;

        const fileList = document.getElementById('fileList');
        if (data.files && Object.keys(data.files).length) {
            fileList.innerHTML = Object.entries(data.files).map(([name, count]) => `
                <div class="file-item">
                    <div class="info">
                        ${name}<br>
                        <small>${count}개 청크</small>
                    </div>
                </div>
            `).join('');
        } else {
            fileList.innerHTML = '<p style="color:#888;text-align:center;padding:16px;">등록된 파일이 없습니다.</p>';
        }
    }

    // 연구원 목록 로드
    async function loadResearchers() {
        try {
            const resp = await fetch('/api/researchers');
            const data = await resp.json();
            const options = '<option value="">전체 연구원</option>' +
                Object.keys(data.researchers || {}).map(r => `<option value="${r}">${r}</option>`).join('');
            document.getElementById('searchResearcher').innerHTML = options;
            document.getElementById('askResearcher').innerHTML = options;
        } catch(e) {}
    }

    // 헤더 통계
    async function loadHeaderStats() {
        try {
            const resp = await fetch('/api/stats');
            const data = await resp.json();
            document.getElementById('headerStats').textContent =
                `청크: ${data.total_chunks} | 파일: ${data.total_files} | 연구원: ${Object.keys(data.researchers).length}명`;
        } catch(e) {}
    }

    // 초기 로드
    loadHeaderStats();
</script>
</body>
</html>
